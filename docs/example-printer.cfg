#####################################################################
# Example KAST config snippet — add to your printer.cfg
#####################################################################

# Requires an ADXL345 already configured for accelerometer scoring.
# If you don't have one wired up, KAST still works using homing
# repeatability alone — just omit accel_chip or leave the [adxl345]
# section out.
[adxl345]
cs_pin: EBBCan: PA4
#spi_bus: spi1

[kast]
# Name of the [adxl345] section to use for vibration scoring.
# "default" -> looks up the object named exactly "adxl345".
# Set to a named chip (e.g. "hotend") if you used [adxl345 hotend].
accel_chip: default
# Homing attempts per SGT/current candidate during a sweep.
samples: 5
# Step size when sweeping driver_SGT.
sgt_step: 8
# Playful console messages during long sweeps. Set to false for quiet output.
fun_mode: true

[include macros/kast.cfg]
