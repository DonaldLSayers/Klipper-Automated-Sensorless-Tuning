#####################################################################
# Example KAST config snippet, add to your printer.cfg
#####################################################################

# Requires an ADXL345 already configured for accelerometer scoring.
# If you don't have one wired up, KAST still works using its
# false-trigger check alone, just omit accel_chip or leave the
# [adxl345] section out.
[adxl345]
cs_pin: EBBCan: PA4
#spi_bus: spi1

[kast]
# Name of the [adxl345] section to use for vibration scoring.
# "default" -> looks up the object named exactly "adxl345".
# Set to a named chip (e.g. "hotend") if you used [adxl345 hotend].
accel_chip: default
# Test cycles per SGT/current candidate during KAST_CALIBRATE.
samples: 5
# Step size when searching driver_SGT.
sgt_step: 8
# How far past the currently configured SGT the default search
# explores, in the more-sensitive (gentler) direction only, never the
# harsher direction, since a known-working value already survives that
# much force at the real endstop and there's nothing to gain testing
# past it by default. Pass SGT_MIN/SGT_MAX to override per-run if you
# deliberately want to test the other direction too.
sgt_radius: 16
# Total span (mm) of KAST_CALIBRATE's test moves, centered on the bed.
# 100 means +/-50mm from center each direction. This all happens in
# free space near bed center, not at the real endstop, so there's no
# crash risk regardless of size, but a bigger square takes longer per
# test cycle.
safe_zone_square: 100
# Speed (mm/s) for those test moves.
safe_zone_speed: 50.0
# Playful console messages during long searches. Set to false for quiet output.
fun_mode: true
# Where per-run CSV/PNG results are saved, one subfolder per stepper.
results_dir: ~/printer_data/config/kast_results
# Auto-render a PNG after each KAST_CALIBRATE (requires matplotlib on
# the host and the full KAST repo, not just kast.py, to be installed).
enable_plots: true

[include macros/kast.cfg]
