#####################################################################
# Example KAST config snippet, add to your printer.cfg
#####################################################################

# Requires an ADXL345 already configured for accelerometer scoring.
# If you don't have one wired up, KAST still works using homing
# repeatability alone, just omit accel_chip or leave the [adxl345]
# section out.
[adxl345]
cs_pin: EBBCan: PA4
#spi_bus: spi1

[kast]
# Name of the [adxl345] section to use for vibration scoring.
# "default" -> looks up the object named exactly "adxl345".
# Set to a named chip (e.g. "hotend") if you used [adxl345 hotend].
accel_chip: default
# Homing attempts per SGT/current candidate during a sweep.
samples: 5
# Step size when sweeping driver_SGT.
sgt_step: 8
# How far past the currently configured SGT the default sweep
# explores, in the more-sensitive (gentler) direction only, never the
# harsher direction, since a known-working value already survives that
# much force and there's nothing to gain testing past it by default.
# Pass SGT_MIN/SGT_MAX to override per-run if you deliberately want to
# test the harsher direction too.
sgt_radius: 16
# If a step's homed position drifts more than this many mm from the
# known-working baseline's position, KAST stops walking further in
# that direction rather than continuing past it. Catches settings
# that technically "succeed" but land somewhere physically different
# from where the baseline actually homes, a sign something's off.
max_position_drift: 2.0
# Playful console messages during long sweeps. Set to false for quiet output.
fun_mode: true
# Where per-run CSV/PNG results are saved, one subfolder per stepper.
results_dir: ~/printer_data/config/kast_results
# Auto-render a PNG after each KAST_CALIBRATE (requires matplotlib on
# the host and the full KAST repo, not just kast.py, to be installed).
enable_plots: true

[include macros/kast.cfg]
