#####################################################################
# KAST macros
#
# Ships its own [homing_override] so KAST fully controls homing
# current during a sweep (a bare SET_TMC_CURRENT before G28 gets
# clobbered by any user macro that re-applies its own hardcoded
# homing current, which is exactly what a CoreXY-style dual-motor
# homing macro needs to do). If you already have a [homing_override],
# merge its logic into _KAST_HOME_AXIS and the [homing_override]
# gcode below instead of including this file verbatim, and make sure
# you keep ALL of its logic, not just the per-axis current handling.
# Klipper only allows one [homing_override]; whichever one is active
# fully replaces the other, there is no merging. If your original
# override does something like lift Z before X/Y homing to clear a
# corner obstruction, and you drop that here, the toolhead can crash.
#####################################################################

[gcode_macro _KAST_HOMING_STATE]
# Homing current (amps) applied to both X and Y motors immediately
# before a sensorless homing move (CoreXY-style setups move both
# motors to home either axis, so both need to drop to a safe current).
# KAST_CALIBRATE overrides this live via SET_GCODE_VARIABLE while
# sweeping; KAST_APPLY persists the winning value here.
variable_home_current: 0.49
# Driver config section for each axis' motor, e.g. 'tmc2240 stepper_x'.
# Used to look up run_current so it can be restored after homing.
# Set these to match your printer if they differ.
variable_driver_x: 'tmc2240 stepper_x'
variable_driver_y: 'tmc2240 stepper_y'
# Lift Z this many mm before doing any X/Y homing move. This matters
# if the nozzle can rest low enough to hit a bed clip, corner post, or
# the bed itself while moving in X/Y. Set to 0 to disable if your
# printer doesn't need it (e.g. tall gantry, no obstructions at low Z).
# Uses SET_KINEMATIC_POSITION to fake a known Z so a lift is possible
# even before Z has actually been homed, this is standard practice but
# means Z position is assumed, not measured, until Z is homed for real.
variable_prelift_z: 4
# How far to move the toolhead up after Z homes for real.
variable_z_home_lift: 10
# Travel speed (mm/min) for the move to bed center before Z homing.
variable_z_travel_speed: 15000
gcode:
    # State holder only -- not meant to be run directly.

[gcode_macro _KAST_HOME_AXIS]
description: Internal - homes one sensorless axis at the current KAST home_current
gcode:
    {% set axis = params.AXIS|upper %}
    {% set s = printer['gcode_macro _KAST_HOMING_STATE'] %}
    {% set run_x = printer.configfile.settings[s.driver_x].run_current|float %}
    {% set run_y = printer.configfile.settings[s.driver_y].run_current|float %}

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={s.home_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={s.home_current}

    SET_KINEMATIC_POSITION {axis}=15 SET_HOMED={axis}
    G91
    G1 {axis}-15 F1200
    M400

    G28 {axis}

    G91
    G1 {axis}-15 F1200

    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y}

[gcode_macro _KAST_HOME_Z]
description: Internal - moves to bed center then homes Z
gcode:
    {% set s = printer['gcode_macro _KAST_HOMING_STATE'] %}
    {% set x_center = (printer.toolhead.axis_maximum.x + printer.toolhead.axis_minimum.x) / 2 %}
    {% set y_center = (printer.toolhead.axis_maximum.y + printer.toolhead.axis_minimum.y) / 2 %}

    G90
    G1 X{x_center} Y{y_center} F{s.z_travel_speed}
    G28 Z
    G1 Z{s.z_home_lift} F1500

[homing_override]
axes: xyz
gcode:
    {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set s = printer['gcode_macro _KAST_HOMING_STATE'] %}

    {% if s.prelift_z|float > 0 and 'z' not in printer.toolhead.homed_axes %}
        SET_KINEMATIC_POSITION Z=1 SET_HOMED=Z
        G1 Z{s.prelift_z} F1200
    {% endif %}

    {% if home_all or 'X' in params %}
        _KAST_HOME_AXIS AXIS=X
    {% endif %}
    {% if home_all or 'Y' in params %}
        _KAST_HOME_AXIS AXIS=Y
    {% endif %}
    {% if home_all or 'Z' in params %}
        _KAST_HOME_Z
    {% endif %}

[gcode_macro KAST_TUNE_X]
description: Sweep driver_SGT (and current/speed) for stepper_x and report the best value
gcode:
    KAST_CALIBRATE STEPPER=stepper_x AXIS=x {rawparams}

[gcode_macro KAST_TUNE_Y]
description: Sweep driver_SGT (and current/speed) for stepper_y and report the best value
gcode:
    KAST_CALIBRATE STEPPER=stepper_y AXIS=y {rawparams}

[gcode_macro KAST_TUNE_ALL]
description: Sweep driver_SGT for both X and Y sensorless axes
gcode:
    KAST_CALIBRATE STEPPER=stepper_x AXIS=x
    KAST_CALIBRATE STEPPER=stepper_y AXIS=y
    KAST_STATUS

[gcode_macro KAST_TEST_X]
description: Sanity-check stepper_x's currently configured SGT/current/speed
gcode:
    KAST_TEST STEPPER=stepper_x AXIS=x {rawparams}

[gcode_macro KAST_TEST_Y]
description: Sanity-check stepper_y's currently configured SGT/current/speed
gcode:
    KAST_TEST STEPPER=stepper_y AXIS=y {rawparams}

[gcode_macro KAST_TEST_ALL]
description: Sanity-check current SGT/current/speed on both X and Y
gcode:
    KAST_TEST STEPPER=stepper_x AXIS=x
    KAST_TEST STEPPER=stepper_y AXIS=y
