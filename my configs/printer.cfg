# Mainline Klipper config - Octopus Pro V1.1 (STM32H723) + Nitehawk36 (RP2040, USB)
# Built from the generic Octopus Pro template + Don's existing Kalico config's hardware mapping.
# Kalico-only features (pid_v, SAVE_CONFIG PID/mesh/z-offset values) have been stripped.
# You will need to redo: PID_CALIBRATE (extruder + bed), PROBE_CALIBRATE (z_offset), BED_MESH_CALIBRATE.

[shaketune]
# result_folder: ~/printer_data/config/ShakeTune_results
#    Path where the processed results will be stored. If the folder doesn't exist,
#    it will be automatically created. You can change this if you'd like to store 
#    results in a different location.
# number_of_results_to_keep: 10
#    This setting defines how many results you want to keep in the result folder.
#    Once the specified number is exceeded, older results will be automatically deleted
#    to free up space on the SD card and avoid cluttering the results folder.
# keep_raw_data: False
#    If set to True, Shake&Tune will store both the processed graphs and the raw accelerometer
#    .stdata files in the results folder. This can be useful for debugging or archiving purposes.
#    Please always attach them when reporting any issues on GitHub or Discord.
# show_macros_in_webui: True
#    Mainsail and Fluidd doesn't create buttons for system commands (macros that are not part
#    of the printer.cfg file). This option allow Shake&Tune to inject them into the webui at runtime.
#    If set to False, the macros will be hidden but still accessible from the console by typing
#    their names manually, which can be useful if you prefer to encapsulate them into your own macros.
# timeout: 600
#    This defines the maximum processing time (in seconds) to allows to Shake&Tune for generating 
#    graphs from a .stdata file. 10 minutes should be more than enough in most cases, but if you have
#    slower hardware (e.g., older SD cards or low-performance devices), increase it to prevent timeouts.
# measurements_chunk_size: 2
#    Each Shake&Tune command uses the accelerometer to take multiple measurements. By default,
#    Shake&Tune will write a chunk of data to disk every two measurements, and at the end of the
#    command will merge these chunks into the final .stdata file for processing. "2" is a very
#    conservative setting to avoid Klipper Timer Too Close errors on lower end devices with little
#    RAM, and should work for everyone. However, if you are using a powerful computer, you may
#    wish to increase this value to keep more measurements in memory (e.g., 15-20) before writing
#    the chunk and avoid stressing the filesystem too much.
# max_freq: 200
#    This setting defines the maximum frequency at which the calculation of the power spectral density
#    is cutoff. The default value should be fine for most machines and accelerometer combinations and
#    avoid touching it unless you know what you're doing.
# dpi: 300
#    Controls the resolution of the generated graphs. The default value of 300 dpi was optimized
#    and strikes a balance between performance and readability, ensuring that graphs are clear
#    without using too much RAM to generate them. Usually, you shouldn't need to change this value.

[include mainsail.cfg]
[include homing.cfg]
[include macros.cfg]

[axis_twist_compensation]

[force_move]
enable_force_move: True

[temperature_sensor Pi]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[input_shaper]
shaper_freq_x: 58.6
shaper_type_x: mzv
damping_ratio_x: 0.075
shaper_freq_y: 36.4
shaper_type_y: mzv
damping_ratio_y: 0.072

[bed_mesh]
speed: 300
horizontal_move_z: 3
zero_reference_position: 175, 175
##--------------------------------------------------------------------
mesh_min: 40, 40
mesh_max: 310,310
##--------------------------------------------------------------------
fade_start: 0.6
fade_end: 10.0
probe_count: 100, 100
adaptive_margin: 10
mesh_pps: 0,0
algorithm: bicubic

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

[exclude_object]

#####################################################################
#   MCUs
#####################################################################

[mcu nhk]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_rp2040_4E363334320E9F5D-if00
restart_method: command
##--------------------------------------------------------------------

[mcu]
##  Obtain definition by "ls -l /dev/serial/by-id/" then unplug to verify
##--------------------------------------------------------------------
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_2D0042000A51313339373836-if00
restart_method: command
##--------------------------------------------------------------------

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Remove either the serial or canbus_uuid line dependant on your setup.
serial: /dev/serial/by-id/usb-Cartographer_stm32g431xx_610034000F5030514B343620-if00
restart_method: command # Not needed for probes using CAN. 

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 15 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3000             #Max 4000
max_z_velocity: 15          #Max 15 for 12V TMC Drivers, can increase for 24V
max_z_accel: 350
square_corner_velocity: 5.0

#####################################################################
#   X/Y Stepper Settings
#####################################################################

##  B Stepper - Left
##  Connected to MOTOR_0
[stepper_x]
step_pin: PF13
dir_pin: !PF12
enable_pin: !PF14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2240_stepper_x:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 80   #Max 100
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_x]
cs_pin: PC4
spi_bus: spi1
run_current: 1.58
stealthchop_threshold: 0
diag0_pin: ^!PG6
driver_SGT: 2
rref: 12000

##  A Stepper - Right
##  Connected to MOTOR_1
[stepper_y]
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
rotation_distance: 40
microsteps: 16
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_min: 0
position_endstop: 350
position_max: 350
homing_speed: 80  #Max 100
homing_retract_dist: 0
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: PD11
spi_bus: spi1
run_current: 1.58
stealthchop_threshold: 0
diag0_pin: ^!PG9
driver_SGT: 2
rref: 12000

#####################################################################
#   Z Stepper Settings
#####################################################################

##  Z0 Stepper - Front Left
##  Connected to MOTOR_2
[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
##  Run PROBE_CALIBRATE after first successful boot to set z_offset in [probe] below
position_max: 330
position_min: -10
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 0

[tmc2240 stepper_z]
cs_pin: PC6
spi_bus: spi1
run_current: 0.8
stealthchop_threshold: 0
rref: 12000

##  Z1 Stepper - Rear Left
##  Connected to MOTOR_3
[stepper_z1]
step_pin: PG4
dir_pin: !PC1
enable_pin: !PA2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2240 stepper_z1]
cs_pin: PC7
spi_bus: spi1
run_current: 0.8
stealthchop_threshold: 0
rref: 12000

##  Z2 Stepper - Rear Right
##  Connected to MOTOR_4
[stepper_z2]
step_pin: PF9
dir_pin: PF10
enable_pin: !PG2
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2240 stepper_z2]
cs_pin: PF2
spi_bus: spi1
run_current: 0.8
stealthchop_threshold: 0
rref: 12000

##  Z3 Stepper - Front Right
##  Connected to MOTOR_5
[stepper_z3]
step_pin: PC13
dir_pin: !PF0
enable_pin: !PF1
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32

[tmc2240 stepper_z3]
cs_pin: PE4
spi_bus: spi1
run_current: 0.8
stealthchop_threshold: 0
rref: 12000

#####################################################################
#   Extruder (on Nitehawk36 - nhk)
#####################################################################

[extruder]
step_pin: nhk:gpio23
dir_pin: !nhk:gpio24
enable_pin: !nhk:gpio25
heater_pin: nhk:gpio9
sensor_pin: nhk:gpio29
pullup_resistor: 2200

rotation_distance: 4.634285544320834
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
max_extrude_only_distance: 500
max_extrude_cross_section: 6

sensor_type: PT1000
min_temp: 10
max_temp: 270
max_power: 1
min_extrude_temp: 170
#control: pid
##  Placeholder values - run PID_CALIBRATE HEATER=extruder TARGET=240 and let it overwrite these
#pid_kp: 26.213
#pid_ki: 1.304
#pid_kd: 131.721
pressure_advance: 0.035

[tmc2209 extruder]
sense_resistor: 0.100
uart_pin: nhk:gpio0
tx_pin: nhk:gpio1
interpolate: false
run_current: 0.6
stealthchop_threshold: 0

#####################################################################
#   Bed Heater
#####################################################################

##  SSR Pin - HE1
##  Thermistor - TB
[heater_bed]
heater_pin: PA1
sensor_type: Generic 3950
sensor_pin: PF3
max_power: 1
min_temp: 0
max_temp: 120
#control: pid
##  Placeholder values - run PID_CALIBRATE HEATER=heater_bed TARGET=110 and let it overwrite these
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#   Probe (on Nitehawk36 - nhk)
#####################################################################

# [probe]
# pin: nhk:gpio10
# x_offset: -2
# y_offset: 25
# z_offset: 0.0
# ##  PLACEHOLDER - DO NOT PRINT WITH THIS VALUE.
# ##  Run PROBE_CALIBRATE after boot, then SAVE_CONFIG to overwrite this.
# speed: 5
# samples: 4
# samples_result: median
# sample_retract_dist: 1.0
# samples_tolerance: 0.006
# samples_tolerance_retries: 3

#####################################################################
#   Fan Control
#####################################################################

##  Print Cooling Fan (on Nitehawk36)
[fan]
pin: nhk:gpio6
kick_start_time: 0.5

##  Hotend Fan (on Nitehawk36, with tachometer)
[heater_fan hotend_fan]
pin: nhk:gpio5
tachometer_pin: nhk:gpio16
tachometer_ppr: 2
tachometer_poll_interval: 0.00015

##  Controller fans (Octopus Pro)
[controller_fan controller_fan1]
pin: PD12
kick_start_time: 0.5
max_power: 0.4
heater: heater_bed

[controller_fan controller_fan2]
pin: PD13
kick_start_time: 0.5
max_power: 0.4
heater: heater_bed

[controller_fan controller_fan3]
pin: PD14
kick_start_time: 0.5
max_power: 0.8
heater: heater_bed

#####################################################################
#   LED Control
#####################################################################

[neopixel chamber_lights]
pin: PB10
chain_count: 25

#####################################################################
#   Accelerometer
#####################################################################

[adxl345]
# Select 1 of the cs_pin below depending on the probe you have. 
# Having the wrong one selected will cause an Endless Bootloop
# Cartographer V4 has int2 connected to the probes PA1 pin
cs_pin: cartographer:PA0 # For Cartographer V4
spi_bus: spi1

[resonance_tester]
accel_chip: adxl345
##--------------------------------------------------------------------
##  350mm build
probe_points:
    175, 175, 20
accel_per_hz: 115
##--------------------------------------------------------------------

#####################################################################
#   Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
timeout: 1800

##  NOTE: safe_z_home is NOT used here since Z homes via the probe
##  (endstop_pin: probe:z_virtual_endstop above). Kept commented for reference
##  in case you switch back to a physical Z endstop later.
# [safe_z_home]
# home_xy_position: 175, 175 # This should be for the CENTRE OF YOUR BED.

[quad_gantry_level]
##--------------------------------------------------------------------
##  Gantry Corners for 350mm Build
gantry_corners:
    -60,-10
    410,420
##  Probe points
points:
    50,25
    50,275
    300,275
    300,25
##--------------------------------------------------------------------
speed: 300
horizontal_move_z: 20
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<5V>

#####################################################################
#   Macros
#####################################################################

[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30

[gcode_macro G32]
gcode:
    SAVE_GCODE_STATE NAME=STATE_G32
    G90
    G28
    QUAD_GANTRY_LEVEL
    G28
    PARK
    RESTORE_GCODE_STATE NAME=STATE_G32

[gcode_macro PRINT_START]
gcode:
    {% set bedtemp = params.BED|int %}
    {% set hotendtemp = params.EXTRUDER|int %}
    M117 Preheating
    M140 S{bedtemp}                       ; set Bed Temperature and start Heating
    M190 S{bedtemp}                       ; wait for Bed Temp
    M104 S{hotendtemp}                    ; set Hotend Temperature and start Heating
    G90                                   ; absolute positioning
    G28                                   ; home all axes (X, Y, then Z via probe)
    QUAD_GANTRY_LEVEL                     ; Level out all Z Motors
    G28 Z                                 ; re-home Z after QGL
    BED_MESH_CALIBRATE                    ; standard bed mesh
    M109 S{hotendtemp}                    ; wait for Hotend Temp
    G90                                   ; absolute positioning
    M117 Printer Go BURR!

[gcode_macro PRINT_END]
gcode:
    # safe anti-stringing move coords
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}

    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F1800                ; retract filament

    TURN_OFF_HEATERS

    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan

    BED_MESH_CLEAR

    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0

